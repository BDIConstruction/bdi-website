  <script>
  // A photograph that fails to arrive - a request dropped on a patchy phone
  // connection - leaves a broken tile for good, because the browser never asks
  // again. Ask again, twice, before giving up. The query string is only there
  // to sidestep the cached failure.
  (function(){
    var TRIES = 2;
    document.addEventListener('error', function(e){
      var img = e.target;
      if (!img || img.tagName !== 'IMG') return;
      var tried = Number(img.getAttribute('data-retry') || 0);
      if (tried >= TRIES) return;
      img.setAttribute('data-retry', tried + 1);
      var src = (img.getAttribute('src') || '').split('?')[0];
      if (!src) return;
      setTimeout(function(){ img.src = src + '?r=' + (tried + 1); }, 700 * (tried + 1));
    }, true);   // capture, because error does not bubble
  })();
  </script>

  <script>
  (function(){
    var root = document.documentElement;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!calm) {
      [].forEach.call(document.images, function(im){
        if (im.classList.contains('logomark')) return;
        im.classList.add('fade-img');
        var done = function(){ im.classList.add('ready'); };
        im.addEventListener('load', done, { once:true });
        im.addEventListener('error', done, { once:true });
        if (im.complete && im.naturalWidth) done();
      });
      addEventListener('load', function(){
        [].forEach.call(document.images, function(im){
          if (im.complete) im.classList.add('ready');
        });
      });
    }

    if (calm) return;
    root.classList.add('reveal-on');

    var items = [].slice.call(document.querySelectorAll('.rv'));
    var pending = [];
    var ticking = false;

    function sweep(){
      ticking = false;
      var h = window.innerHeight;
      for (var i = 0; i < items.length; i++){
        var el = items[i], r = el.getBoundingClientRect();
        var shown = el.classList.contains('in');
        var inView = r.top < h * 0.9 && r.bottom > 0;
        var gone   = r.bottom < -40 || r.top > h + 40;
        if (inView && !shown && !pending[i]){
          pending[i] = setTimeout(function(e){ return function(){ e.classList.add('in'); }; }(el), parseInt(el.getAttribute('data-d') || 0, 10));
        } else if (gone){
          clearTimeout(pending[i]); pending[i] = 0;
          if (shown) el.classList.remove('in');
        } else if (shown){
          pending[i] = 0;
        }
      }
    }
    function onScroll(){ if (!ticking){ ticking = true; requestAnimationFrame(sweep); } }
    addEventListener('scroll', onScroll, { passive:true });
    addEventListener('resize', onScroll);
    addEventListener('load', onScroll);
    requestAnimationFrame(sweep);
  })();
  </script>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Project photo viewer">
    <button class="lb-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-next" type="button" aria-label="Next photo">&rsaquo;</button>

    <span class="lb-cap" id="lb-cap"></span>
  </div>

  <script>
  (function(){
    var cards = [].slice.call(document.querySelectorAll('.gcard'));
    if (!cards.length) return;
    var lb = document.getElementById('lb'), img = document.getElementById('lb-img'),
        cap = document.getElementById('lb-cap'), i = 0, opener = null;
    function show(n){
      i = (n + cards.length) % cards.length;
      var c = cards[i];
      img.src = c.getAttribute('data-full');
      img.alt = c.querySelector('img').alt;
      cap.textContent = (i + 1) + ' / ' + cards.length;
    }
    function open(n, from){ opener = from; show(n); lb.hidden = false;
      document.body.style.overflow = 'hidden'; lb.querySelector('.lb-close').focus(); }
    function close(){ lb.hidden = true; img.src = ''; document.body.style.overflow = '';
      if (opener) opener.focus(); }
    cards.forEach(function(c, n){ c.addEventListener('click', function(){ open(n, c); }); });
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', function(e){ e.stopPropagation(); show(i - 1); });
    lb.querySelector('.lb-next').addEventListener('click', function(e){ e.stopPropagation(); show(i + 1); });
    lb.addEventListener('click', function(e){ if (e.target === lb || e.target === img) close(); });
    document.addEventListener('keydown', function(e){
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(i - 1);
      else if (e.key === 'ArrowRight') show(i + 1);
    });
  })();
  </script>
