backend:
  name: github
  repo: BDIConstruction/bdi-website
  branch: main
  # Signing in needs a step GitHub Pages cannot do for itself - see
  # oauth-worker/README.md. This is where that step lives.
  base_url: https://bdi-cms-auth.dcolmenares.workers.dev
  auth_endpoint: auth

# Uploaded photos land in the repo root alongside the existing ones,
# so paths match what the pages already use. Both of these are relative on
# purpose: a GitHub Pages project site is served from a subdirectory, so a
# leading slash would point above the site and break.
media_folder: "uploads"
public_folder: "uploads"

publish_mode: simple
# no site_url on purpose - the site is not on a custom domain, so Decap
# should use whatever address it is actually being served from
logo_url: ../logo.png

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.title | lower | replace(' ', '-')}}"
    identifier_field: title
    summary: "{{title}}  —  {{city}}"
    sortable_fields: [order, title, year, city]
    view_filters:
      - label: Missing a city
        field: city
        pattern: "^$"
    fields:
      - { name: title, label: Project name, widget: string }
      - { name: photo, label: Cover photo, widget: image, required: false,
          hint: "Full-size photograph. Shown on the Projects grid and first on the project's own page." }
      - { name: description, label: Description, widget: text, required: false,
          hint: "A few sentences about the project. Shown on the project's own page. Leave a blank line between paragraphs." }
      - { name: gallery, label: More photos, widget: list, required: false,
          field: { label: Photo, name: image, widget: image },
          hint: "Additional photos for the project's own page, shown after the cover photo." }
      - { name: city, label: City, widget: string, required: false, hint: "e.g. Miami" }
      - { name: state, label: State, widget: string, required: false, default: "FL",
          hint: "Only shown on the card when it is somewhere other than Florida." }
      - { name: sector, label: Sector, widget: select, required: false,
          options: ["", Commercial, Educational, Medical, Multi-family housing,
                    Government, Retail, Hospitality, Industrial, Interiors] }
      - { name: year, label: Year completed, widget: string, required: false,
          hint: "e.g. 2024. Leave blank if the project is still under way." }
      - { name: delivery, label: Delivery method, widget: select, required: false,
          options: ["", General Contracting, Design-Build, Construction Management] }
      - { name: order, label: Position on the page, widget: number, required: false,
          value_type: int, default: 0,
          hint: "Lower numbers appear first. Newest work is currently at the top." }
      - { name: photo_card, label: Card image (managed automatically), widget: hidden, required: false }
      - { name: wp_date, label: Original date (from the old site), widget: hidden, required: false }
