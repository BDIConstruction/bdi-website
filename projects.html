<title>BDI Construction — Projects</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap');
  :root{
    --ink:#15202B; --paper:#FAF9F5; --navy-deep:#0E2233; --navy:#1B3A54;
    --teal:#4C7C8C; --green:#4FA8D8; --muted:#68737C; --hair:#E4E0D5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; font-weight:300; color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:450; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width:980px; margin:0 auto; padding:0 48px; }
  @media (max-width:800px){ .wrap{padding:0 24px;} }
  .label{ font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:500; }

  /* relative + z-index so the dropdown paints above the page head, which is
     positioned and would otherwise cover it */
  .nav{ position:relative; z-index:50; background:#fff; border-bottom:1px solid var(--hair); }
  .nav-inner{ max-width:980px; margin:0 auto; padding:0 48px; display:flex; align-items:center; justify-content:space-between; height:90px; }
  /* Brand — logo mark */
  .brand{ display:flex; align-items:center; }
  .brand .logomark{ height:52px; width:auto; display:block; }
  @media (max-width:520px){ .brand .logomark{height:40px;} }
  .navlinks{ display:flex; gap:26px; }
  .navlinks .label{ color:var(--muted); letter-spacing:.12em; white-space:nowrap; }
  .navlinks > a:hover .label, .navlinks > div:hover > a .label{ color:var(--navy); }
  .navlinks > div{ position:relative; }
  .navlinks a.active .label{ color:var(--navy); }
  .dropdown{
    position:absolute; top:100%; left:50%; transform:translateX(-50%) translateY(-4px); margin-top:26px;
    background:#fff; min-width:170px; padding:16px 0; border:1px solid var(--hair);
    opacity:0; visibility:hidden; text-align:center;
    transition:opacity .2s ease, visibility .2s ease, transform .2s ease;
    transition-delay:.35s;            /* forgiving on the way out */
  }
  /* invisible bridge over the gap between the link and the panel, so the
     pointer does not un-hover while travelling down to the menu */
  .dropdown::before{ content:""; position:absolute; left:0; right:0; top:-30px; height:30px; }
  .navlinks > div:hover .dropdown{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); transition-delay:0s; }
  .dropdown a{ display:block; padding:9px 22px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .dropdown a.here{ color:var(--navy); }
  .dropdown a:hover{ color:var(--navy); }
  @media (max-width:920px){ .navlinks{display:none;} }

  .pagehead{ position:relative; padding:120px 0 90px; overflow:hidden; background:var(--navy-deep); }
  .pagehead .year{
    position:absolute; top:0; right:0;
    font-family:'Fraunces',serif; font-weight:400; font-style:italic;
    font-size:min(8vw, 98px); color:rgba(160,200,235,.12); z-index:0; line-height:.9;
    white-space:nowrap; user-select:none;
  }
  .pagehead .inner{ position:relative; z-index:1; }
  .pagehead .label{ color:var(--green); margin-bottom:20px; }
  .pagehead h1{ font-size:clamp(32px,4.2vw,50px); font-style:italic; color:#fff; }
  .pagehead .crumbs{ margin-top:22px; color:rgba(255,255,255,.55); }
  .pagehead .crumbs a{ font-size:12px; letter-spacing:.08em; color:rgba(255,255,255,.72); }
  .pagehead .crumbs a:hover{ color:var(--green); }

  .work{ padding:20px 0 110px; background:#fff; }
  .work .count{ color:var(--muted); font-size:14px; margin-bottom:44px; font-weight:300; }
  .pgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:34px 28px; }
  /* flex column, not block: a <button> centres its contents, so a short card
     stretched to match a taller one in the same row pushed its photograph
     down and broke the alignment across the row */
  .pcard{ display:flex; flex-direction:column; align-items:stretch; text-align:left;
          background:none; border:none; padding:0; cursor:zoom-in; font:inherit; }
  .pcard .photo{ display:block; aspect-ratio:3/2; overflow:hidden; background:var(--paper); margin-bottom:16px; flex:none; }
  .pcard .photo img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .pcard:hover .photo img{ transform:scale(1.04); }
  .pcard:focus-visible{ outline:2px solid var(--navy); outline-offset:4px; }
  .pcard .loc{ color:var(--teal); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  /* two lines reserved so most rows come out the same height */
  .pcard h4{ font-family:'Fraunces',serif; font-size:17px; font-weight:450; color:var(--navy); line-height:1.35; min-height:2.7em; }
  @media (max-width:860px){ .pgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:26px 20px; } }
  @media (max-width:560px){ .pgrid{ grid-template-columns:1fr; } }

  .lb{ position:fixed; inset:0; z-index:100; background:rgba(11,29,44,.94); display:flex; align-items:center; justify-content:center; padding:5vmin; }
  .lb[hidden]{ display:none; }
  .lb img{ max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .lb button{ position:absolute; background:none; border:none; color:#fff; cursor:pointer; font-family:'Inter',sans-serif; font-weight:300; line-height:1; opacity:.75; padding:12px; }
  .lb button:hover, .lb button:focus-visible{ opacity:1; }
  .lb .lb-close{ top:12px; right:18px; font-size:40px; }
  .lb .lb-prev, .lb .lb-next{ top:50%; transform:translateY(-50%); font-size:56px; }
  .lb .lb-prev{ left:10px; } .lb .lb-next{ right:10px; }
  .lb .lb-cap{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.8); font-size:12px; letter-spacing:.1em; text-align:center; max-width:80%; }
  @media (max-width:600px){ .lb .lb-prev, .lb .lb-next{ font-size:40px; } }

  footer{ background:#fff; border-top:1px solid var(--hair); padding:44px 0; text-align:center; }
  footer .label{ color:var(--muted); font-weight:400; }

  /* MOTION
     One long, soft ease for everything, so nothing snaps into position.
     Elements are visible by default — .reveal-on is added by script, so with
     JavaScript off the page simply reads normally. */
  .reveal-on .rv  { opacity:0; transform:translateY(20px) scale(.988); }
  .reveal-on .rv-l{ opacity:0; transform:translateX(-30px); }
  .reveal-on .rv-r{ opacity:0; transform:translateX(30px); }
  .reveal-on .rv, .reveal-on .rv-l, .reveal-on .rv-r{
    transition:opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
    will-change:opacity, transform;
  }
  .reveal-on .rv.in, .reveal-on .rv-l.in, .reveal-on .rv-r.in{ opacity:1; transform:none; }
  /* the side-entering pieces sit in two-column grids; clip so their offset
     cannot push the page sideways while they are still out of position */
  .reveal-on .grid{ overflow-x:clip; }
  /* on narrow screens the columns stack, so travel vertically instead */
  @media (max-width:860px){
    .reveal-on .rv-l, .reveal-on .rv-r{ transform:translateY(20px); }
  }

  /* photographs ease up as they decode instead of appearing all at once */
  .fade-img{ opacity:0; transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1); }
  .fade-img.ready{ opacity:1; }
  @media print{ .fade-img{ opacity:1 !important; } }

  /* the hero photograph settles rather than arriving at rest */
  .reveal-on .hero .skyline img{ transform:scale(1.05); transition:transform 2s cubic-bezier(.16,1,.3,1); }
  .reveal-on.settled .hero .skyline img{ transform:scale(1); }

  /* hovers ease instead of switching */
  a, .btn, button{ transition:color .3s cubic-bezier(.16,1,.3,1), background-color .3s cubic-bezier(.16,1,.3,1),
                              border-color .3s cubic-bezier(.16,1,.3,1), opacity .3s cubic-bezier(.16,1,.3,1); }

  @media (prefers-reduced-motion:reduce){
    .reveal-on .rv, .reveal-on .rv-l, .reveal-on .rv-r{ opacity:1 !important; transform:none !important; transition:none; }
    .fade-img{ opacity:1 !important; transition:none; }
    .reveal-on .hero .skyline img{ transform:none !important; transition:none; }
  }
</style>

  <script>
  (function(){
    var root = document.documentElement;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Photographs fade up as they decode. Applied from script, so with
    // JavaScript off images are simply visible.
    if (!calm) {
      [].forEach.call(document.images, function(im){
        if (im.classList.contains('logomark')) return;
        im.classList.add('fade-img');
        var done = function(){ im.classList.add('ready'); };
        // listeners first, then the cached check - the other order leaves a
        // gap where an image can finish loading and never be revealed
        im.addEventListener('load', done, { once:true });
        im.addEventListener('error', done, { once:true });
        if (im.complete && im.naturalWidth) done();
      });
      // safety net: no photograph may stay invisible because an event was missed
      addEventListener('load', function(){
        [].forEach.call(document.images, function(im){
          if (im.complete) im.classList.add('ready');
        });
      });
    }

    // --- counting figures -------------------------------------------------
    // The target is cached on first sight, so a re-run never reads a
    // half-counted value off the page.
    function prep(el){
      if (el.dataset.target) return;
      var m = (el.textContent || '').trim().match(/^(\d[\d,]*)([\s\S]*)$/);
      if (!m) return;
      el.dataset.target = m[1].replace(/,/g, '');
      el.dataset.suffix = m[2];
    }
    function startAt(el){
      return el.getAttribute('data-count') === 'now' ? new Date().getFullYear() : 0;
    }
    function runCount(el){
      prep(el);
      if (!el.dataset.target || calm) return;
      var to = parseInt(el.dataset.target, 10), suffix = el.dataset.suffix, from = startAt(el);
      if (from === to) { el.textContent = to + suffix; return; }
      var run = String(Number(el.dataset.run || 0) + 1);
      el.dataset.run = run;                       // supersedes any run still going
      var dur = 1800, t0 = 0;
      requestAnimationFrame(function tick(ts){
        if (el.dataset.run !== run) return;
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 4))) + suffix;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = to + suffix;
      });
    }
    function resetCount(el){
      prep(el);
      if (!el.dataset.target || calm) return;
      el.dataset.run = String(Number(el.dataset.run || 0) + 1);   // cancel in flight
      el.textContent = startAt(el) + el.dataset.suffix;
    }

    if (calm) return;
    root.classList.add('reveal-on');
    requestAnimationFrame(function(){ root.classList.add('settled'); });

    // --- reveals ----------------------------------------------------------
    // Elements re-animate every time they come back into view, so they are
    // reset once clearly off screen rather than being left revealed.
    var items = [].slice.call(document.querySelectorAll('.rv, .rv-l, .rv-r'));
    var pending = [];
    var ticking = false;

    function sweep(){
      ticking = false;
      var h = window.innerHeight;
      for (var i = 0; i < items.length; i++){
        var el = items[i], r = el.getBoundingClientRect();
        var shown = el.classList.contains('in');
        var inView = r.top < h * 0.9 && r.bottom > 0;
        var gone   = r.bottom < -40 || r.top > h + 40;
        if (inView && !shown && !pending[i]){
          pending[i] = setTimeout(function(e){ return function(){
            e.classList.add('in');
            [].forEach.call(e.querySelectorAll('[data-count]'), runCount);
          }; }(el), parseInt(el.getAttribute('data-d') || 0, 10));
        } else if (gone){
          clearTimeout(pending[i]); pending[i] = 0;
          if (shown){
            el.classList.remove('in');
            [].forEach.call(el.querySelectorAll('[data-count]'), resetCount);
          }
        } else if (shown){
          pending[i] = 0;
        }
      }
    }
    function onScroll(){ if (!ticking){ ticking = true; requestAnimationFrame(sweep); } }
    addEventListener('scroll', onScroll, { passive:true });
    addEventListener('resize', onScroll);
    addEventListener('load', onScroll);
    requestAnimationFrame(sweep);
  })();
  </script>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Project photo viewer">
    <button class="lb-prev" type="button" aria-label="Previous project">&lsaquo;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-next" type="button" aria-label="Next project">&rsaquo;</button>
    <button class="lb-close" type="button" aria-label="Close viewer">&times;</button>
    <span class="lb-cap" id="lb-cap"></span>
  </div>

  <script>
  (function(){
    var cards = [].slice.call(document.querySelectorAll('.pcard'));
    if (!cards.length) return;
    var lb = document.getElementById('lb'), img = document.getElementById('lb-img'),
        cap = document.getElementById('lb-cap'), i = 0, opener = null;
    function show(n){
      i = (n + cards.length) % cards.length;
      var c = cards[i];
      img.src = c.getAttribute('data-full');
      img.alt = c.querySelector('img').alt;
      cap.textContent = c.querySelector('h4').textContent + '  \u00b7  ' + (i + 1) + ' / ' + cards.length;
    }
    function open(n, from){ opener = from; show(n); lb.hidden = false;
      document.body.style.overflow = 'hidden'; lb.querySelector('.lb-close').focus(); }
    function close(){ lb.hidden = true; img.src = ''; document.body.style.overflow = '';
      if (opener) opener.focus(); }
    cards.forEach(function(c, n){ c.addEventListener('click', function(){ open(n, c); }); });
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', function(e){ e.stopPropagation(); show(i - 1); });
    lb.querySelector('.lb-next').addEventListener('click', function(e){ e.stopPropagation(); show(i + 1); });
    lb.addEventListener('click', function(e){ if (e.target === lb || e.target === img) close(); });
    document.addEventListener('keydown', function(e){
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(i - 1);
      else if (e.key === 'ArrowRight') show(i + 1);
    });
  })();
  </script>
